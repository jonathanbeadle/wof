<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo Loyalty - Draw Your Number</title>
  <link rel="stylesheet" href="bingo.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <button id="muteButton" class="mute-btn">🔊</button>
  
  <div class="main-container">
    <div class="game-area">
      <div class="logo-container">
        <img src="logo1.png" alt="The Ivorson Logo" class="ivorson-logo">
      </div>
      <div class="title">BINGO LOYALTY</div>
      
      <div class="ball-display" id="ballDisplay">
        <canvas id="ball3d"></canvas>
      </div>
      
      <div class="recent-section">
        <h3>Recent Numbers</h3>
        <div class="recent-list" id="recentList">
          <div class="no-draws">No numbers drawn yet</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Big result overlay -->
  <div class="result-overlay" id="resultOverlay">
    <div class="result-content">
      <div class="result-ball-container">
        <canvas id="resultBall3d"></canvas>
      </div>
      <div class="result-text">
        <h2 id="resultTitle">Your Number!</h2>
        <p>Get this stamped on your bingo card</p>
      </div>
    </div>
  </div>

  <audio id="drawSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/212/212-preview.mp3" type="audio/mpeg">
  </audio>
  <audio id="resultSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/221/221-preview.mp3" type="audio/mpeg">
  </audio>

  <script src="bingo.js"></script>
</body>
</html>
